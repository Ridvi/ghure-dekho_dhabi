<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ঘুরে দেখো ঢাবি | ঢাবির কতটুকু ঘুরে দেখেছেন?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anek+Bangla:wdth,wght@75..125,300..800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EDF0E6; --surface:#FAFBF6; --ink:#14281F; --muted:#56665C; --line:#D0D8C8;
  --red:#CF2F28; --green:#0F6A4A; --on-green:#FFFFFF; --chip:#E1E7D7; --scrim:rgba(10,22,16,.62);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1712; --surface:#15221B; --ink:#E6ECE2; --muted:#9AA99E; --line:#29392F;
    --red:#FF5E52; --green:#5BC796; --on-green:#0B1611; --chip:#1D2C24; --scrim:rgba(0,0,0,.7);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1712; --surface:#15221B; --ink:#E6ECE2; --muted:#9AA99E; --line:#29392F;
  --red:#FF5E52; --green:#5BC796; --on-green:#0B1611; --chip:#1D2C24; --scrim:rgba(0,0,0,.7);
  color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
@media (prefers-reduced-motion: reduce){html{scroll-behavior:auto}}
*,*::before,*::after{box-sizing:border-box}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:"Anek Bangla","Noto Sans Bengali","Hind Siliguri",system-ui,sans-serif;
  font-size:17px;line-height:1.55;-webkit-font-smoothing:antialiased;
  padding-bottom:88px;
}
@media (min-width:960px){body{padding-bottom:0}}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--red);outline-offset:2px}

/* header */
.top{max-width:1200px;margin:0 auto;padding:16px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-stretch:112%;font-size:1.12rem}
.brand svg{width:26px;height:26px;flex:none}
.lang{background:transparent;border:1.5px solid var(--ink);border-radius:999px;padding:5px 14px;font-weight:600;cursor:pointer}
.lang:hover{background:var(--ink);color:var(--bg)}

/* hero */
.hero{max-width:1200px;margin:0 auto;padding:18px 20px 0}
.hero h1{margin:0;font-size:clamp(2.3rem,6.4vw,5rem);font-weight:800;font-stretch:125%;line-height:1.1;letter-spacing:-.012em;max-width:15ch}
html[lang="en"] .hero h1{max-width:17ch}
.lede{margin:16px 0 0;max-width:54ch;color:var(--muted);font-size:1.12rem}

/* tool */
.tool{max-width:1200px;margin:26px auto 0;padding:0 20px;display:grid;gap:20px;grid-template-columns:minmax(0,1fr)}
@media (min-width:960px){.tool{grid-template-columns:minmax(0,1.42fr) minmax(330px,1fr);align-items:start}}
.mapcol{display:flex;flex-direction:column;gap:10px;min-width:0}
.mapbox{position:relative;border-radius:20px;overflow:hidden;border:1px solid var(--line);line-height:0;transition:background .25s}
.mapbox svg{display:block;width:100%;height:auto;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;touch-action:pan-y}
.mapbox.zoomed svg{touch-action:none;cursor:grab}
.mapbox.dragging svg{cursor:grabbing}
.mapbox .detail{transition:opacity .2s}
.mapbox.deep .detail{opacity:1}
.zoom{position:absolute;bottom:10px;left:10px;z-index:2;display:flex;gap:6px;line-height:1}
.zoom button{width:38px;height:38px;display:grid;place-items:center;padding:0;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font-size:1.45rem;font-weight:700;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.zoom button:hover:not(:disabled){border-color:var(--ink)}
.zoom button:disabled{opacity:.45;cursor:default}
.zoom svg{width:18px;height:18px}
@media (max-width:520px){.zoom button{width:34px;height:34px;font-size:1.3rem}}
.zhint{position:absolute;left:50%;top:50%;z-index:3;transform:translate(-50%,-50%);max-width:80%;text-align:center;background:rgba(10,22,16,.8);color:#fff;padding:10px 16px;border-radius:12px;font-size:.95rem;line-height:1.4;opacity:0;pointer-events:none;transition:opacity .2s}
.zhint.show{opacity:1}
.pin{cursor:pointer;outline:none}
.pin .dot{transform-box:fill-box;transform-origin:center}
.pin:hover .dot{stroke-width:4.5}
.blk .shp{transition:fill .2s ease, stroke .2s ease}
.blk:hover .shp{filter:brightness(.93)}
.blk:focus-visible .shp{stroke:var(--red);stroke-width:3;stroke-opacity:1}
.blk.flash .shp{animation:flash .45s ease}
@keyframes flash{0%{opacity:1}35%{opacity:.45}100%{opacity:1}}
.pin:hover .lbl,.pin:focus-visible .lbl{visibility:visible}
.pin:focus-visible .ring{opacity:1}
.pin.pop .dot{animation:pop .34s ease}
@keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.5)}100%{transform:scale(1)}}
.legend{margin:0;padding:0 4px;display:flex;align-items:center;gap:8px;color:var(--muted);font-size:.92rem}
.legend i{width:22px;height:14px;border-radius:3px;flex:none;border:1.5px solid var(--red);background:repeating-linear-gradient(45deg,var(--red) 0 3px,transparent 3px 7px);opacity:.75}
.caption{margin:0;padding:0 4px;color:var(--muted);font-size:.98rem;min-height:3.1em}
.caption b{color:var(--ink);font-weight:700}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px 16px 10px}
@media (min-width:960px){
  .panel{position:sticky;top:calc(14px + env(safe-area-inset-top,0px))}
  .list{max-height:calc(100vh - 400px);min-height:240px;overflow:auto;overscroll-behavior:contain;padding-right:4px}
}
.phead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:0 4px}
.phead h2{margin:0;font-size:1.3rem;font-weight:700;line-height:1.25}
.count{font-weight:800;font-stretch:75%;font-size:2.7rem;line-height:.9;color:var(--red);white-space:nowrap;font-variant-numeric:tabular-nums}
.field{display:block;margin:16px 4px 0;font-size:.92rem;font-weight:600;color:var(--muted)}
.field input{display:block;width:100%;margin-top:6px;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);font-size:1rem;font-weight:500;color:var(--ink)}
.field input:focus{border-color:var(--ink);outline:none}
.tlabel{margin:16px 4px 8px;font-size:.92rem;font-weight:600;color:var(--muted)}
.themes{display:flex;flex-wrap:wrap;gap:8px;padding:0 4px}
.sw{display:flex;align-items:center;gap:8px;background:transparent;border:1.5px solid var(--line);border-radius:999px;padding:4px 12px 4px 4px;font-size:.92rem;cursor:pointer}
.sw i{width:24px;height:24px;border-radius:50%;flex:none;box-shadow:inset 0 0 0 1px rgba(0,0,0,.14)}
.sw[aria-pressed="true"]{border-color:var(--ink);font-weight:700}
.bulk{display:flex;gap:8px;margin:16px 4px 6px}
.ghost{flex:1;background:transparent;border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;font-size:.92rem;font-weight:600;cursor:pointer}
.ghost:hover{border-color:var(--ink)}
.grp h3{margin:16px 8px 4px;font-size:.95rem;font-weight:700;color:var(--green)}
.item{display:grid;grid-template-columns:22px minmax(0,1fr);align-items:center;gap:12px;padding:7px 8px;border-radius:10px;cursor:pointer}
.item:hover{background:var(--chip)}
.item input{appearance:none;-webkit-appearance:none;width:22px;height:22px;margin:0;border:2px solid var(--ink);border-radius:6px;background:var(--surface);display:grid;place-items:center;cursor:pointer}
.item input:checked{background:var(--red);border-color:var(--red)}
.item input:checked::after{content:"";width:11px;height:6px;border-left:2.6px solid #fff;border-bottom:2.6px solid #fff;transform:translateY(-1px) rotate(-45deg)}
.item b{display:block;font-weight:650;line-height:1.3}
.item span{display:block;color:var(--muted);font-size:.9rem;line-height:1.4;margin-top:2px}

/* verdict */
.verdict{max-width:1200px;margin:40px auto 0;padding:0 20px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:clamp(22px,4.4vw,48px);display:grid;gap:26px;grid-template-columns:minmax(0,1fr)}
@media (min-width:780px){.card{grid-template-columns:minmax(0,1fr) 220px;align-items:start}}
.stamp{order:-1;justify-self:center;width:200px;height:200px;border-radius:50%;border:4px solid var(--red);color:var(--red);position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:26px;transform:rotate(-11deg)}
@media (min-width:780px){.stamp{order:0;margin-top:6px}}
.stamp::before{content:"";position:absolute;inset:9px;border:2px dashed currentColor;border-radius:50%;opacity:.65}
.stamp .sp{font-weight:800;font-stretch:75%;font-size:3.1rem;line-height:1;font-variant-numeric:tabular-nums}
.stamp .st{font-weight:700;font-stretch:80%;font-size:1.08rem;line-height:1.15;margin-top:6px}
.stamp.hit{animation:stamp .5s cubic-bezier(.2,.9,.3,1.25)}
@keyframes stamp{0%{transform:rotate(-26deg) scale(1.75);opacity:0}55%{opacity:1}100%{transform:rotate(-11deg) scale(1)}}
.who{margin:0;color:var(--muted);font-weight:600}
.score{margin:6px 0 0;font-size:clamp(1.25rem,2.6vw,1.6rem);font-weight:600;line-height:1.35;max-width:36ch}
.meter{height:10px;margin-top:14px;max-width:520px;border-radius:999px;background:var(--chip);overflow:hidden}
.meter span{display:block;height:100%;width:0;background:var(--red);border-radius:inherit;transition:width .45s ease}
.compliment{margin:26px 0 0;font-size:clamp(1.55rem,3.6vw,2.45rem);font-weight:700;font-stretch:84%;line-height:1.28;max-width:24ch;text-wrap:balance}
html[lang="en"] .compliment{max-width:28ch}
.badges{display:flex;flex-wrap:wrap;gap:10px;margin:22px 0 0;padding:0;list-style:none}
.badges li{display:flex;gap:10px;align-items:flex-start;background:var(--chip);border-radius:14px;padding:10px 14px 10px 10px;max-width:310px}
.badges .e{font-size:1.45rem;line-height:1.1}
.badges b{display:block;font-weight:700;line-height:1.25}
.badges small{display:block;color:var(--muted);font-size:.86rem;line-height:1.35;margin-top:2px}
.next{margin:22px 0 0;color:var(--muted);max-width:60ch}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:24px}
.btn{border-radius:12px;padding:12px 18px;font-weight:700;cursor:pointer;border:1.5px solid var(--ink);background:transparent}
.btn.primary{background:var(--green);border-color:var(--green);color:var(--on-green)}
.btn:hover{filter:brightness(1.06)}
.btn[disabled]{opacity:.6;cursor:progress}

footer{max-width:1200px;margin:48px auto 0;padding:22px 20px 34px;border-top:1px solid var(--line);color:var(--muted);font-size:.92rem}
footer p{margin:0;max-width:70ch}
.social{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:0}
.social span{font-weight:700;color:var(--ink);margin-right:6px}
.social a{display:inline-flex;align-items:center;gap:6px;color:var(--ink);text-decoration:none;font-weight:600;border:1.5px solid var(--line);border-radius:999px;padding:6px 12px 6px 14px}
.social a svg{width:14px;height:14px}
.social a:hover{border-color:var(--ink);background:var(--chip)}

/* mobile dock */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;align-items:center;gap:12px;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));background:var(--surface);border-top:1px solid var(--line);transition:transform .25s ease}
.dock.away{transform:translateY(110%)}
.dock .dc{font-weight:800;font-stretch:75%;font-size:1.7rem;line-height:1;color:var(--red);font-variant-numeric:tabular-nums}
.dock .dt{flex:1;min-width:0;font-size:.95rem;font-weight:600;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dock .btn{padding:8px 12px;font-size:.92rem}
@media (min-width:960px){.dock{display:none}}

/* preview overlay */
.ov{position:fixed;inset:0;z-index:50;background:var(--scrim);display:none;align-items:center;justify-content:center;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px))}
.ov.open{display:flex}
.ovc{background:var(--surface);border-radius:20px;padding:16px;width:100%;max-width:480px;max-height:100%;overflow:auto}
.ovc h2{margin:2px 4px 12px;font-size:1.2rem}
.ovc img{display:block;width:100%;height:auto;border-radius:12px;border:1px solid var(--line)}
.ovc .hint{margin:10px 4px 0;color:var(--muted);font-size:.9rem}
.ovc .actions{margin-top:14px}
.ovc .actions .btn{flex:1 1 auto}

.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;pointer-events:none;z-index:60;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:600;font-size:.95rem;transition:opacity .2s,transform .2s;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (min-width:960px){.toast{bottom:calc(28px + env(safe-area-inset-bottom,0px))}}

@media (prefers-reduced-motion: reduce){
  .stamp.hit,.pin.pop .dot{animation:none}
  .meter span,.dock,.toast{transition:none}
}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
</style>
</head>
<body>

<header class="top">
  <div class="brand">
    <svg viewBox="0 0 26 26" aria-hidden="true"><rect width="26" height="26" rx="7" fill="#0F6A4A"/><circle cx="12" cy="13" r="6.2" fill="#CF2F28"/></svg>
    <span data-t="brand">ঘুরে দেখো ঢাবি</span>
  </div>
  <button class="lang" id="langBtn" type="button">English</button>
</header>

<section class="hero">
  <h1 data-t="title">ঢাবির কতটুকু ঘুরে দেখেছেন?</h1>
  <p class="lede" data-t="lede"></p>
</section>

<main class="tool">
  <div class="mapcol">
    <div class="mapbox" id="mapbox">
      <div id="mapsvg"></div>
      <div class="zoom" role="group" id="zoomBar">
        <button type="button" id="zIn">+</button>
        <button type="button" id="zOut">−</button>
        <button type="button" id="zReset"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
      </div>
      <div class="zhint" id="zhint" aria-hidden="true"></div>
    </div>
    <p class="caption" id="caption" aria-live="polite"></p>
  </div>

  <aside class="panel" aria-labelledby="panelTitle">
    <div class="phead">
      <h2 id="panelTitle" data-t="panel"></h2>
      <span class="count" id="count">০ / ২২</span>
    </div>
    <label class="field"><span data-t="nameLabel"></span>
      <input id="name" type="text" maxlength="40" autocomplete="given-name">
    </label>
    <p class="tlabel" id="themeLabel" data-t="themeLabel"></p>
    <div class="themes" id="themes" role="group" aria-labelledby="themeLabel"></div>
    <div class="bulk">
      <button class="ghost" type="button" id="allBtn" data-t="all"></button>
      <button class="ghost" type="button" id="noneBtn" data-t="none"></button>
    </div>
    <div class="list" id="list"></div>
  </aside>
</main>

<section class="verdict" id="verdict" aria-live="polite">
  <div class="card">
    <div>
      <p class="who" id="who"></p>
      <p class="score" id="score"></p>
      <div class="meter" aria-hidden="true"><span id="meter"></span></div>
      <p class="compliment" id="compliment"></p>
      <ul class="badges" id="badges"></ul>
      <p class="next" id="next"></p>
      <div class="actions">
        <button class="btn primary" type="button" id="imgBtn" data-t="makeImg"></button>
        <button class="btn" type="button" id="copyBtn" data-t="copy"></button>
      </div>
    </div>
    <div class="stamp" id="stamp"><span class="sp" id="stampPct">০%</span><span class="st" id="stampTitle"></span></div>
  </div>
</section>

<footer>
  <div class="social">
    <span data-t="maker"></span>
    <a href="https://www.facebook.com/mahir.alvi.ridvi" target="_blank" rel="noopener noreferrer">Facebook<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M5 11 11 5M6 5h5v5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
    <a href="https://www.instagram.com/__mahir.alvi__/" target="_blank" rel="noopener noreferrer">Instagram<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M5 11 11 5M6 5h5v5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
    <a href="https://www.linkedin.com/in/ridvi/" target="_blank" rel="noopener noreferrer">LinkedIn<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M5 11 11 5M6 5h5v5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
  </div>
</footer>

<div class="dock" id="dock">
  <span class="dc" id="dockCount">০/২২</span>
  <span class="dt" id="dockTitle"></span>
  <button class="btn primary" type="button" id="dockBtn" data-t="dockBtn"></button>
</div>

<div class="ov" id="ov" role="dialog" aria-modal="true" aria-labelledby="ovTitle">
  <div class="ovc">
    <h2 id="ovTitle" data-t="pvTitle"></h2>
    <img id="ovImg" alt="">
    <p class="hint" id="ovHint"></p>
    <div class="actions">
      <button class="btn primary" type="button" id="dlBtn" data-t="download" hidden></button>
      <button class="btn" type="button" id="shareBtn" data-t="share" hidden></button>
      <button class="btn" type="button" id="ovClose" data-t="close"></button>
    </div>
  </div>
</div>

<div class="toast" id="toast" role="status"></div>

<script>
(() => {
"use strict";

/* ---------- data ---------- */
// Every place is a block. Coordinates are traced from the printed DU campus map
// (photo pixel coords fx, fy). shape: poly (area), ell (oval), pt (small landmark), line (road).
// k: fill kind for areas  b = building, g = green, w = water.
const SPOTS = [
  /* ---- Northern Hall Para ---- */

/* ---------- state ---------- */
const KEY = 'unseen-du-v1';
const state = {sel:new Set(), theme:'flag', lang:'bn', name:''};
try{
  const raw = localStorage.getItem(KEY);
  if(raw){
    const o = JSON.parse(raw);
    if(Array.isArray(o.sel)) o.sel.forEach(id=>{ if(SPOTS.some(s=>s.id===id)) state.sel.add(id); });
    if(o.theme && THEMES[o.theme]) state.theme = o.theme;
    if(o.lang==='en'||o.lang==='bn') state.lang = o.lang;
    if(typeof o.name==='string') state.name = o.name.slice(0,40);
  }
}catch(e){}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify({sel:[...state.sel],theme:state.theme,lang:state.lang,name:state.name})); }catch(e){} }

function joinList(arr){
  if(arr.length<=1) return arr.join('');
  return arr.slice(0,-1).join(', ') + L().and + arr[arr.length-1];
}

/* ---------- map ---------- */
// Traced from the printed Dhaka University campus map (photo pixel coords).
const MAP_W = 1400, MAP_H = 1080;
const T = (fx,fy) => [fx-10, fy-40];
const f1 = n => (+n).toFixed(1);
const path = (pts, close) => pts.map((q,i)=>{ const [x,y] = T(q[0],q[1]); return (i?'L':'M')+f1(x)+','+f1(y); }).join(' ') + (close?' Z':'');
const isPt = sp => sp.shape.t === 'pt';
function anchorOf(sp){
  const s = sp.shape;
  if(s.l){ const [x,y] = T(s.l[0], s.l[1]); return {x,y}; }
  if(s.t==='pt' || s.t==='ell'){ const [x,y] = T(s.c[0], s.c[1]); return {x,y}; }
  let ax=0, ay=0; s.p.forEach(q=>{ ax+=q[0]; ay+=q[1]; });
  const [x,y] = T(ax/s.p.length, ay/s.p.length); return {x,y};
}
function areaOf(sp){
  const s = sp.shape;
  if(s.t==='pt') return 0;
  if(s.t==='multi') return s.parts.reduce((a,q)=>a+areaOf({shape:{t:'poly',p:q.p}}),0);
  if(s.t==='ell') return Math.PI*s.rx*s.ry;
  if(s.t==='line') return 1;
  let a=0; for(let i=0;i<s.p.length;i++){ const [x0,y0]=s.p[i], [x1,y1]=s.p[(i+1)%s.p.length]; a += x0*y1-x1*y0; }
  return Math.abs(a/2);
}
const AREA_ORDER = SPOTS.filter(sp=>!isPt(sp)).sort((a,b)=>areaOf(b)-areaOf(a));

function fillK(k, P){ return k==='g' ? P.green : k==='w' ? P.water : (P.bld || P.block); }

function mapSVG(sel, plan, kOn, kOff){

      shape = `<path class="shp" d="${path(sh.p,true)}" fill="${on?P.accent:baseFill(sp,P)}" stroke="${on?P.accent:P.muted}" stroke-width="1.2" stroke-opacity=".7" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>`;

      + `<circle class="ring" r="18" fill="none" stroke="${P.ink}" stroke-width="3" opacity="0"/>`
      + `<circle class="dot" r="11" fill="${on?P.accent:P.pin}" stroke="${on?P.accent:P.ink}" stroke-width="3"/>`
      + `<path class="tick" d="M-5,0.5 L-1.5,4 L5.5,-4" fill="none" stroke="${P.tick}" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" opacity="${on?1:0}"/>`
      + `</g></g>`;

  // labels layer
  s += `<g class="labels" pointer-events="none">`;
  SPOTS.concat(FIXED).forEach(sp=>{
    const on = sel.has(sp.id);
    if(exporting){
      const q = plan[sp.id]; if(!q) return;
      s += `<text x="${f1(q.x)}" y="${f1(q.y)}" text-anchor="${q.a}" font-size="${f1(LFS*q.k)}" font-weight="800" fill="${P.ink}" stroke="${P.paper}" stroke-width="${f1(5*q.k)}" stroke-linejoin="round" paint-order="stroke">${esc(mapName(sp))}</text>`;

    }
  });
  s += `</g>`;
  return s + '</svg>';
}

/* label sizes measured once per render (bold, at base size) */
let labelM = {};
function lblEl(id){ return $('mapsvg').querySelector(`.lbl[data-id="${id}"]`); }
function measureLabels(){
  const svg = svgEl(); if(!svg) return;
  labelM = {};
  svg.querySelectorAll('.lbl').forEach(t=>{
    const w0 = t.getAttribute('font-weight'), fs0 = t.getAttribute('font-size'), v0 = t.getAttribute('visibility');
    t.setAttribute('font-weight','800'); t.setAttribute('font-size', LFS);
    let bb; try{ bb = t.getBBox(); }catch(e){ bb = null; }
    t.setAttribute('font-weight', w0); t.setAttribute('font-size', fs0);
    if(v0) t.setAttribute('visibility', v0);
    labelM[t.dataset.id] = {w:(bb && bb.width) || mapName(spot(t.dataset.id)).length*11, h:(bb && bb.height) || 26};
  });
}
function labelPos(dir, m, k, p){
  const w = m.w*k, h = m.h*k;
  if(dir==='c') return {x:p.x, y:p.y+h*0.3, a:'middle', box:{x0:p.x-w/2, x1:p.x+w/2, y0:p.y-h/2, y1:p.y+h/2}};
  if(dir==='r') return {x:p.x+18*k, y:p.y+h*0.3, a:'start', box:{x0:p.x+16*k, x1:p.x+16*k+w, y0:p.y-h/2, y1:p.y+h/2}};
  if(dir==='l') return {x:p.x-18*k, y:p.y+h*0.3, a:'end', box:{x0:p.x-16*k-w, x1:p.x-16*k, y0:p.y-h/2, y1:p.y+h/2}};
  if(dir==='t') return {x:p.x, y:p.y-17*k-h*0.2, a:'middle', box:{x0:p.x-w/2, x1:p.x+w/2, y0:p.y-17*k-h, y1:p.y-17*k}};
  return {x:p.x, y:p.y+17*k+h*0.8, a:'middle', box:{x0:p.x-w/2, x1:p.x+w/2, y0:p.y+17*k, y1:p.y+17*k+h}};
}
const overlap = (a,b) => a.x0 < b.x1 && a.x1 > b.x0 && a.y0 < b.y1 && a.y1 > b.y0;
function planLabels(k, onlySel, kOff){
  const pinR = sp => 14*((onlySel && !state.sel.has(sp.id)) ? (kOff||k) : k);
  const pins = SPOTS.filter(isPt).map(sp=>{ const p = anchorOf(sp), r = pinR(sp); return {id:sp.id, x0:p.x-r, x1:p.x+r, y0:p.y-r, y1:p.y+r}; });
  const order = SPOTS.concat(FIXED).filter(sp=>!onlySel || state.sel.has(sp.id))
    .sort((a,b)=>((state.sel.has(b.id)?100:0)+b.pr) - ((state.sel.has(a.id)?100:0)+a.pr));
  const placed = [], plan = {};
  SPOTS.concat(FIXED).forEach(sp=>{ plan[sp.id] = null; });
  order.forEach(sp=>{
    const m = labelM[sp.id]; if(!m) return;
    const p = anchorOf(sp);
    const dirs = isPt(sp) ? [sp.d||'r', ...['r','l','b','t'].filter(d=>d!==(sp.d||'r'))] : ['c','b','t'];
    for(const d of dirs){
      const q = labelPos(d, m, k, p), bx = q.box;
      if(bx.x0 < 2 || bx.y0 < 2 || bx.x1 > MAP_W-2 || bx.y1 > MAP_H-2) continue;
      if(placed.some(o=>overlap(o,bx))) continue;
      if(pins.some(o=>o.id!==sp.id && overlap(o,bx))) continue;
      plan[sp.id] = {x:q.x, y:q.y, a:q.a, k}; placed.push(bx); break;
    }
    if(!plan[sp.id] && sp.force){
      const q = labelPos(dirs[0], m, k, p);
      plan[sp.id] = {x:q.x, y:q.y, a:q.a, k}; placed.push(q.box);
    }
  });
  return plan;
}
function layoutLabels(k){
  const svg = svgEl(); if(!svg) return;
  const plan = planLabels(k);
  svg.querySelectorAll('.lbl').forEach(t=>{
    const sp = spot(t.dataset.id), q = plan[sp.id];
    const fb = q || (()=>{ const m = labelM[sp.id] || {w:60,h:26}; const r = labelPos(isPt(sp)?(sp.d||'r'):'c', m, k, anchorOf(sp)); return {x:r.x, y:r.y, a:r.a}; })();
    t.setAttribute('x', f1(fb.x)); t.setAttribute('y', f1(fb.y)); t.setAttribute('text-anchor', fb.a);
    t.setAttribute('font-size', f1(LFS*k)); t.setAttribute('stroke-width', f1(5*k));
    if(q){ t.removeAttribute('visibility'); delete t.dataset.peek; } else t.setAttribute('visibility','hidden');
  });
}
// show a hidden label while hovering its block
$('mapsvg').addEventListener('pointerover', e=>{
  const g = e.target.closest && e.target.closest('.pin'); if(!g) return;
  const t = lblEl(g.dataset.id);
  if(t && t.getAttribute('visibility')==='hidden'){ t.dataset.peek = '1'; t.removeAttribute('visibility'); }
});
$('mapsvg').addEventListener('pointerout', e=>{
  const g = e.target.closest && e.target.closest('.pin'); if(!g) return;
  if(e.relatedTarget && g.contains(e.relatedTarget)) return;
  const t = lblEl(g.dataset.id);
  if(t && t.dataset.peek){ t.setAttribute('visibility','hidden'); delete t.dataset.peek; }
});

function renderMap(){
  $('mapsvg').innerHTML = mapSVG(state.sel);
  $('mapbox').style.background = THEMES[state.theme].map.paper;
  measureLabels();
  applyView(true);
}

function paintPin(id, animate){
  const g = $('mapsvg').querySelector(`.pin[data-id="${id}"]`);
  if(!g) return;
  const sp = spot(id), P = THEMES[state.theme].map, on = state.sel.has(id);
  g.setAttribute('aria-checked', on);
  if(isPt(sp)){
    g.querySelector('.halo').setAttribute('opacity', on?0.22:0);
    const dot = g.querySelector('.dot');
    dot.setAttribute('fill', on?P.accent:P.pin);
    dot.setAttribute('stroke', on?P.accent:P.ink);
    g.querySelector('.tick').setAttribute('opacity', on?1:0);
    if(animate && on){ g.classList.remove('pop'); void g.getBBox(); g.classList.add('pop'); }
  } else {
    g.querySelectorAll('.shp').forEach(shp=>{
      if(sp.shape.t==='line') shp.setAttribute('stroke', on?P.accent:P.road);
      else { shp.setAttribute('fill', on?P.accent:fillK(shp.dataset.k || sp.shape.k, P)); shp.setAttribute('stroke', on?P.accent:P.muted); }
    });
    if(animate && on){ g.classList.remove('flash'); void g.getBBox(); g.classList.add('flash'); }
  }
  const t = lblEl(id); if(t) t.setAttribute('font-weight', on?800:600);
}

/* ---------- zoom & pan ---------- */
const FULL = {x:0, y:0, w:MAP_W, h:MAP_H};
const MIN_W = MAP_W/7;
let view = {...FULL};
const gesture = {ptrs:new Map(), drag:null, pinch:null, moved:false};
const reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const svgEl = () => $('mapsvg').querySelector('svg');
const isZoomed = () => view.w < MAP_W - 0.5;

function clampView(v){
  const w = Math.min(MAP_W, Math.max(MIN_W, v.w));
  const h = w*MAP_H/MAP_W;
  return {w, h, x:Math.min(Math.max(v.x,0), MAP_W-w), y:Math.min(Math.max(v.y,0), MAP_H-h)};
}
let lastK = -1;
function labelScale(){
  const r = $('mapsvg').getBoundingClientRect();
  const sc = r.width ? r.width/view.w : 0.7;
  const z = MAP_W/view.w;
  const f = Math.min(18, Math.max(11.5, 12*Math.pow(z, 0.3)));   // on-screen label size in px
  return f/(LFS*sc);
}
function applyView(force){
  const svg = svgEl();
  if(svg){
    svg.setAttribute('viewBox', `${view.x} ${view.y} ${view.w} ${view.h}`);
    const k = labelScale();
    if(force===true || Math.abs(k-lastK) > 0.004){
      lastK = k;
      const tf = `scale(${k.toFixed(4)})`;
      svg.querySelectorAll('.pb').forEach(g=>g.setAttribute('transform', tf));
      svg.querySelectorAll('.detail').forEach(t=>t.setAttribute('font-size', (13*k).toFixed(2)));
      layoutLabels(k);
    }
  }
  const box = $('mapbox');
  box.classList.toggle('zoomed', isZoomed());
  box.classList.toggle('deep', view.w <= MAP_W/1.6);
  $('zIn').disabled = view.w <= MIN_W + 0.5;
  $('zOut').disabled = !isZoomed();
  $('zReset').disabled = !isZoomed();
}
window.addEventListener('resize', ()=>applyView(true));
if(document.fonts && document.fonts.ready){
  document.fonts.ready.then(()=>{ measureLabels(); applyView(true); });
}
let anim = 0;
function animateTo(target){
  cancelAnimationFrame(anim);
  if(reduceMotion){ view = target; applyView(); return; }
  const from = {...view}, t0 = performance.now(), dur = 220;
  const step = now=>{
    const k = Math.min(1, (now-t0)/dur), e = 1 - Math.pow(1-k, 3);
    view = clampView({x:from.x+(target.x-from.x)*e, y:from.y+(target.y-from.y)*e, w:from.w+(target.w-from.w)*e});
    applyView();
    if(k<1) anim = requestAnimationFrame(step);
  };
  anim = requestAnimationFrame(step);
}
function zoomAt(factor, cx, cy, animate){
  const nw = Math.min(MAP_W, Math.max(MIN_W, view.w/factor));
  const r = nw/view.w;
  const target = clampView({x:cx-(cx-view.x)*r, y:cy-(cy-view.y)*r, w:nw});
  if(animate) animateTo(target); else { cancelAnimationFrame(anim); view = target; applyView(); }
}
function toSvg(clientX, clientY){
  const r = svgEl().getBoundingClientRect();
  return {x:view.x + (clientX-r.left)/r.width*view.w, y:view.y + (clientY-r.top)/r.height*view.h};
}
const center = () => ({x:view.x+view.w/2, y:view.y+view.h/2});

$('zIn').addEventListener('click', ()=>{ const c = center(); zoomAt(1.6, c.x, c.y, true); });
$('zOut').addEventListener('click', ()=>{ const c = center(); zoomAt(1/1.6, c.x, c.y, true); });
$('zReset').addEventListener('click', ()=>animateTo({...FULL}));

const isMac = /Mac|iPhone|iPad/.test(navigator.platform || navigator.userAgent || '');
let hintTimer;
function showHint(){
  const h = $('zhint');
  h.textContent = L().wheelHint(isMac ? '⌘' : 'Ctrl');
  h.classList.add('show');
  clearTimeout(hintTimer); hintTimer = setTimeout(()=>h.classList.remove('show'), 1400);
}
$('mapbox').addEventListener('wheel', e=>{
  if(e.ctrlKey || e.metaKey){
    e.preventDefault();
    const p = toSvg(e.clientX, e.clientY);
    zoomAt(Math.exp(-e.deltaY*0.0035), p.x, p.y, false);
  } else if(Math.abs(e.deltaY) > 4){ showHint(); }
}, {passive:false});

$('mapbox').addEventListener('keydown', e=>{
  if(e.key==='+' || e.key==='='){ e.preventDefault(); $('zIn').click(); }
  else if(e.key==='-' || e.key==='_'){ e.preventDefault(); $('zOut').click(); }
  else if(e.key==='0'){ e.preventDefault(); $('zReset').click(); }
});

const dist = (a,b) => Math.hypot(a.x-b.x, a.y-b.y);
$('mapsvg').addEventListener('pointerdown', e=>{
  if(e.pointerType==='mouse' && e.button!==0) return;
  const G = gesture;
  G.ptrs.set(e.pointerId, {x:e.clientX, y:e.clientY});
  if(G.ptrs.size===1){
    G.moved = false;
    G.drag = {sx:e.clientX, sy:e.clientY, vx:view.x, vy:view.y};
  } else if(G.ptrs.size===2){
    const [a,b] = [...G.ptrs.values()];
    G.pinch = {d:Math.max(dist(a,b),1), w:view.w, mid:toSvg((a.x+b.x)/2,(a.y+b.y)/2)};
    G.drag = null; G.moved = true;
    try{ $('mapsvg').setPointerCapture(e.pointerId); }catch(err){}
  }
});
window.addEventListener('pointermove', e=>{
  const G = gesture;
  if(!G.ptrs.has(e.pointerId)) return;
  G.ptrs.set(e.pointerId, {x:e.clientX, y:e.clientY});
  if(G.pinch && G.ptrs.size>=2){
    e.preventDefault();
    const [a,b] = [...G.ptrs.values()];
    const nw = Math.min(MAP_W, Math.max(MIN_W, G.pinch.w*G.pinch.d/Math.max(dist(a,b),1)));
    const r = svgEl().getBoundingClientRect();
    const fx = ((a.x+b.x)/2 - r.left)/r.width, fy = ((a.y+b.y)/2 - r.top)/r.height;
    cancelAnimationFrame(anim);
    view = clampView({x:G.pinch.mid.x - fx*nw, y:G.pinch.mid.y - fy*nw*MAP_H/MAP_W, w:nw});
    applyView();
  } else if(G.drag && isZoomed()){
    const dx = e.clientX-G.drag.sx, dy = e.clientY-G.drag.sy;
    if(!G.moved && Math.hypot(dx,dy) > 6){
      G.moved = true;
      $('mapbox').classList.add('dragging');
      try{ $('mapsvg').setPointerCapture(e.pointerId); }catch(err){}
    }
    if(G.moved){
      const r = svgEl().getBoundingClientRect();
      cancelAnimationFrame(anim);
      view = clampView({x:G.drag.vx - dx/r.width*view.w, y:G.drag.vy - dy/r.height*view.h, w:view.w});
      applyView();
    }
  }
}, {passive:false});
function endPointer(e){
  const G = gesture;
  if(!G.ptrs.has(e.pointerId)) return;
  G.ptrs.delete(e.pointerId);
  if(G.ptrs.size < 2) G.pinch = null;
  if(G.ptrs.size === 1){
    const p = [...G.ptrs.values()][0];
    G.drag = {sx:p.x, sy:p.y, vx:view.x, vy:view.y};
  } else if(G.ptrs.size === 0){
    G.drag = null;
    $('mapbox').classList.remove('dragging');
  }
}
window.addEventListener('pointerup', endPointer);
window.addEventListener('pointercancel', endPointer);

/* ---------- list & themes ---------- */
function renderList(){
  const list = $('list');
  list.innerHTML = '';
  GROUPS.forEach(gk=>{
    const wrap = document.createElement('div');
    wrap.className = 'grp';
    const h = document.createElement('h3');
    h.textContent = L().groups[gk];
    wrap.appendChild(h);
    SPOTS.filter(s=>s.g===gk).forEach(sp=>{
      const lab = document.createElement('label');
      lab.className = 'item';
      const cb = document.createElement('input');
      cb.type = 'checkbox'; cb.dataset.id = sp.id; cb.checked = state.sel.has(sp.id);
      cb.addEventListener('change', ()=>toggle(sp.id, cb.checked));
      const txt = document.createElement('div');
      const b = document.createElement('b'); b.textContent = fullName(sp);
      txt.append(b);
      lab.append(cb, txt);
      wrap.appendChild(lab);
    });
    list.appendChild(wrap);
  });
}

function renderThemes(){
  const box = $('themes');
  box.innerHTML = '';
  Object.entries(THEMES).forEach(([k,t])=>{
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'sw';
    b.setAttribute('aria-pressed', k===state.theme);
    const i = document.createElement('i');
    i.style.background = `linear-gradient(135deg, ${t.map.paper} 0 50%, ${t.map.accent} 50% 100%)`;
    const sp = document.createElement('span'); sp.textContent = t[state.lang];
    b.append(i, sp);
    b.addEventListener('click', ()=>{
      state.theme = k; save();
      box.querySelectorAll('.sw').forEach(x=>x.setAttribute('aria-pressed', x===b));
      renderMap();
    });
    box.appendChild(b);
  });
}

/* ---------- verdict ---------- */
function rankIndex(n){
  if(n<=0) return 0;
  if(n>=TOTAL) return 6;
  const f = n/TOTAL;
  return f<=0.15 ? 1 : f<=0.33 ? 2 : f<=0.52 ? 3 : f<=0.74 ? 4 : 5;
}
function variant(){
  let h = 0;
  SPOTS.forEach((s,i)=>{ if(state.sel.has(s.id)) h += (i+1)*7; });
  return h;
}
function complimentText(){
  const r = RANKS[rankIndex(state.sel.size)][state.lang];
  const fits = r.c.filter(f=>!f.when || f.when(state.sel));
  const pool = fits.length ? fits : r.c.filter(f=>!f.when);
  return pool[variant() % pool.length](cleanName());
}
function earnedBadges(){ return BADGES.filter(b=>b.when(state.sel)); }

let lastRank = null;
function update(){
  const n = state.sel.size, p = pct(n), Ls = L();
  const ri = rankIndex(n), rank = RANKS[ri][state.lang];
  $('count').textContent = `${fmt(n)} / ${fmt(TOTAL)}`;
  $('who').textContent = Ls.report(cleanName());
  $('score').textContent = Ls.score(fmt(n), fmt(TOTAL), fmt(p));
  $('meter').style.width = p + '%';
  $('compliment').textContent = complimentText();
  $('stampPct').textContent = fmt(p) + '%';
  $('stampTitle').textContent = rank.t;
  $('dockCount').textContent = `${fmt(n)}/${fmt(TOTAL)}`;
  $('dockTitle').textContent = rank.t;

  const bl = $('badges');
  bl.innerHTML = '';
  earnedBadges().forEach(b=>{
    const li = document.createElement('li');
    const e = document.createElement('span'); e.className='e'; e.textContent=b.e; e.setAttribute('aria-hidden','true');
    const d = document.createElement('div');
    const t = document.createElement('b'); t.textContent = b[state.lang][0];
    const sm = document.createElement('small'); sm.textContent = b[state.lang][1];
    d.append(t, sm); li.append(e, d); bl.appendChild(li);
  });
  bl.hidden = !bl.children.length;

  const todo = PRIORITY.filter(id=>!state.sel.has(id)).slice(0,3).map(id=>fullName(spot(id)));
  $('next').textContent = todo.length ? Ls.next(joinList(todo)) : Ls.nextDone;

  if(lastRank!==null && lastRank!==ri){
    const st = $('stamp');
    st.classList.remove('hit'); void st.offsetWidth; st.classList.add('hit');
  }
  lastRank = ri;
}

/* ---------- interactions ---------- */
function setCaption(id, on){
  const c = $('caption');
  c.textContent = '';
  if(!id){ c.textContent = L().capIdle; return; }
  const sp = spot(id);
  const b = document.createElement('b');
  b.textContent = fullName(sp) + ' ';
  c.appendChild(b);
  c.appendChild(document.createTextNode(on ? `${L().capOn} ${sp[state.lang][1]}` : L().capOff));
}

function toggle(id, force){
  const on = force===undefined ? !state.sel.has(id) : !!force;
  if(on) state.sel.add(id); else state.sel.delete(id);
  save();
  paintPin(id, true);
  const cb = $('list').querySelector(`input[data-id="${id}"]`);
  if(cb) cb.checked = on;
  setCaption(id, on);
  update();
  layoutLabels(lastK > 0 ? lastK : 1);
}

$('mapbox').addEventListener('click', e=>{
  if(gesture.moved){ gesture.moved = false; return; }
  const g = e.target.closest('.pin');
  if(g) toggle(g.dataset.id);
});
$('mapbox').addEventListener('keydown', e=>{
  const g = e.target.closest && e.target.closest('.pin');
  if(g && (e.key==='Enter' || e.key===' ')){ e.preventDefault(); toggle(g.dataset.id); }
});

$('allBtn').addEventListener('click', ()=>{
  SPOTS.forEach(s=>state.sel.add(s.id)); save();
  SPOTS.forEach(s=>paintPin(s.id,false));
  $('list').querySelectorAll('input').forEach(cb=>cb.checked=true);
  setCaption(null); update(); applyView(true);
});
$('noneBtn').addEventListener('click', ()=>{
  state.sel.clear(); save();
  SPOTS.forEach(s=>paintPin(s.id,false));
  $('list').querySelectorAll('input').forEach(cb=>cb.checked=false);
  setCaption(null); update(); applyView(true);
});

$('name').addEventListener('input', e=>{ state.name = e.target.value.slice(0,40); save(); update(); });

$('langBtn').addEventListener('click', ()=>{ state.lang = state.lang==='bn'?'en':'bn'; save(); renderAll(); });

$('dockBtn').addEventListener('click', ()=>{ $('verdict').scrollIntoView({block:'start'}); });

if('IntersectionObserver' in window){
  new IntersectionObserver(entries=>{
    entries.forEach(en=>$('dock').classList.toggle('away', en.isIntersecting));
  }, {threshold:0.15}).observe($('verdict'));
}

let toastTimer;
function toast(msg){
  const t = $('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(()=>t.classList.remove('show'), 2200);
}

/* ---------- copy ---------- */
function shareText(){
  const n = state.sel.size, Ls = L();
  const lines = [
    Ls.brand,
    Ls.report(cleanName()),
    Ls.score(fmt(n), fmt(TOTAL), fmt(pct(n))),
    `${RANKS[rankIndex(n)][state.lang].t}: “${complimentText()}”`
  ];
  const b = earnedBadges();
  if(b.length) lines.push(b.map(x=>`${x.e} ${x[state.lang][0]}`).join('  '));
  return lines.join('\n');
}
$('copyBtn').addEventListener('click', async ()=>{
  const text = shareText();
  let ok = false;
  try{ if(navigator.clipboard && navigator.clipboard.writeText){ await navigator.clipboard.writeText(text); ok = true; } }catch(e){}
  if(!ok){
    try{
      const ta = document.createElement('textarea');
      ta.value = text; ta.setAttribute('readonly',''); ta.style.position='fixed'; ta.style.opacity='0';
      document.body.appendChild(ta); ta.select(); ok = document.execCommand('copy'); ta.remove();
    }catch(e){ ok = false; }
  }
  toast(ok ? L().copied : L().copyFail);
});

/* ---------- image export ---------- */
let downloads = null, dlPromise = Promise.resolve(null);
try{
  if(window.claude && typeof window.claude.use==='function'){
    dlPromise = window.claude.use('downloads').then(d=>{ downloads = d; return d; }).catch(()=>null);
  }
}catch(e){}
const withTimeout = (pr, ms) => Promise.race([pr, new Promise(r=>setTimeout(()=>r(null), ms))]);
function syncDlBtn(){
  $('dlBtn').hidden = !currentBlob;
  $('shareBtn').hidden = !canShareFile();
  $('ovHint').textContent = L().pvHintSave;
}

function loadImg(src){
  return new Promise((res,rej)=>{ const im = new Image(); im.onload=()=>res(im); im.onerror=rej; im.src=src; });
}
function wrapLines(ctx, text, maxW){
  const words = text.split(/\s+/); const lines = []; let line = '';
  words.forEach(w=>{
    const test = line ? line + ' ' + w : w;
    if(ctx.measureText(test).width > maxW && line){ lines.push(line); line = w; }
    else line = test;
  });
  if(line) lines.push(line);
  return lines;
}

let currentBlob = null, currentUrl = null;
async function buildImage(){
  const P = THEMES[state.theme].map, Ls = L();
  const n = state.sel.size, p = pct(n);
  const fam = '"Anek Bangla","Noto Sans Bengali","Nirmala UI",sans-serif';
  const head = Ls.imgHead(cleanName(), fmt(p));
  const sub = Ls.imgSub(fmt(n), fmt(TOTAL));
  const rankT = RANKS[rankIndex(n)][state.lang].t;
  const comp = complimentText();
  try{
    await Promise.all([
      document.fonts.load(`800 64px "Anek Bangla"`, head + rankT),
      document.fonts.load(`500 36px "Anek Bangla"`, sub + comp + Ls.brand)
    ]);
  }catch(e){}

  const W = 1080, PAD = 72, maxW = W - PAD*2;
  const c = document.createElement('canvas');
  let ctx = c.getContext('2d');
  ctx.font = `800 64px ${fam}`; const headLines = wrapLines(ctx, head, maxW);
  ctx.font = `600 38px ${fam}`; let compLines = wrapLines(ctx, `“${comp}”`, maxW);
  if(compLines.length > 4) compLines = compLines.slice(0,4);
  const mapW = W - 80, mapH = mapW*MAP_H/MAP_W;
  const H = PAD + 40 + headLines.length*76 + 56 + 24 + mapH + 40 + 56 + compLines.length*52 + 40 + 50 + PAD;
  c.width = W; c.height = Math.ceil(H);
  ctx = c.getContext('2d');
  ctx.fillStyle = P.paper; ctx.fillRect(0,0,W,c.height);
  ctx.textBaseline = 'alphabetic';

  let y = PAD + 30;
  ctx.fillStyle = P.accent; ctx.font = `700 30px ${fam}`; ctx.fillText(Ls.brand, PAD, y);
  y += 22;
  ctx.fillStyle = P.ink; ctx.font = `800 64px ${fam}`;
  headLines.forEach(l=>{ y += 76; ctx.fillText(l, PAD, y); });
  y += 50;
  ctx.fillStyle = P.muted; ctx.font = `500 34px ${fam}`; ctx.fillText(sub, PAD, y);
  y += 30;

  const img = await loadImg('data:image/svg+xml;charset=utf-8,' + encodeURIComponent(mapSVG(state.sel, planLabels(1.45, true, 0.6), 1.45, 0.6)));
  const mx = (W - mapW)/2;
  ctx.save();
  ctx.beginPath();
  if(ctx.roundRect) ctx.roundRect(mx, y, mapW, mapH, 28); else ctx.rect(mx, y, mapW, mapH);
  ctx.clip();
  ctx.drawImage(img, mx, y, mapW, mapH);
  ctx.restore();
  ctx.strokeStyle = P.edge; ctx.lineWidth = 2;
  ctx.beginPath(); if(ctx.roundRect) ctx.roundRect(mx, y, mapW, mapH, 28); else ctx.rect(mx, y, mapW, mapH); ctx.stroke();
  y += mapH + 40;

  ctx.fillStyle = P.accent; ctx.font = `800 46px ${fam}`; y += 46; ctx.fillText(rankT, PAD, y);
  y += 10;
  ctx.fillStyle = P.ink; ctx.font = `600 38px ${fam}`;
  compLines.forEach(l=>{ y += 52; ctx.fillText(l, PAD, y); });
  y += 70;
  ctx.font = `600 30px ${fam}`; ctx.fillStyle = P.muted;
  ctx.font = `600 28px ${fam}`; ctx.textAlign = 'right'; ctx.fillStyle = P.muted;
  ctx.fillText(Ls.brand, W - PAD, y);

  const blob = await new Promise((res,rej)=>c.toBlob(b=>b?res(b):rej(new Error('blob')), 'image/png'));
  return {blob, dataUrl: c.toDataURL('image/png')};
}

$('imgBtn').addEventListener('click', async ()=>{
  const btn = $('imgBtn');
  btn.disabled = true; btn.textContent = L().making;
  try{
    const out = await buildImage();
    currentBlob = out.blob;
    if(currentUrl) URL.revokeObjectURL(currentUrl);
    currentUrl = URL.createObjectURL(currentBlob);
    $('ovImg').src = out.dataUrl;
    $('ovImg').alt = L().imgHead(cleanName(), fmt(pct(state.sel.size)));
    syncDlBtn();
    $('ov').classList.add('open');
    $('ovClose').focus();
  }catch(e){
    toast(L().imgFail);
  }finally{
    btn.disabled = false; btn.textContent = L().makeImg;
  }
});
function closeOv(){ $('ov').classList.remove('open'); $('imgBtn').focus(); }
$('ovClose').addEventListener('click', closeOv);
$('ov').addEventListener('click', e=>{ if(e.target===$('ov')) closeOv(); });
document.addEventListener('keydown', e=>{ if(e.key==='Escape' && $('ov').classList.contains('open')) closeOv(); });
function plainDownload(fname){
  const a = document.createElement('a');
  a.href = currentUrl; a.download = fname; a.rel = 'noopener'; a.style.display = 'none';
  document.body.appendChild(a); a.click();
  setTimeout(()=>a.remove(), 1000);
}
$('dlBtn').addEventListener('click', async ()=>{
  if(!currentBlob) return;
  const fname = 'ghure-dekho-dhabi.png';
  const dl = downloads || await withTimeout(dlPromise, 2500);
  if(dl){
    try{ await dl.save({filename:fname, data:currentBlob}); toast(L().saved); return; }
    catch(err){
      const code = err && err.code;
      if(code==='declined'){ toast(L().declined); return; }
      if(code==='rate_limited') return;
      downloads = null;
    }
  }
  try{ plainDownload(fname); }catch(e){}
  toast(L().dlStarted);
});
function shareFile(){ return new File([currentBlob], 'ghure-dekho-dhabi.png', {type:'image/png'}); }
function canShareFile(){
  try{ return !!(currentBlob && navigator.canShare && navigator.canShare({files:[shareFile()]})); }catch(e){ return false; }
}
$('shareBtn').addEventListener('click', async ()=>{
  if(!currentBlob) return;
  try{ await navigator.share({files:[shareFile()], title:L().brand}); }
  catch(err){ if(!(err && err.name==='AbortError')) toast(L().shareFail); }
});

/* ---------- render all ---------- */
function renderAll(){
  const Ls = L();
  document.documentElement.lang = state.lang;
  document.title = Ls.docTitle;
  document.querySelectorAll('[data-t]').forEach(el=>{
    const v = Ls[el.dataset.t];
    if(typeof v==='string') el.textContent = v;
  });
  $('langBtn').textContent = Ls.lang;
  $('langBtn').setAttribute('lang', state.lang==='bn'?'en':'bn');
  $('name').placeholder = Ls.namePh;
  [['zIn','zIn'],['zOut','zOut'],['zReset','zReset']].forEach(([id,k])=>{ $(id).setAttribute('aria-label', Ls[k]); $(id).title = Ls[k]; });
  $('zoomBar').setAttribute('aria-label', Ls.zoomBar);
  $('name').value = state.name;
  renderThemes();
  renderList();
  renderMap();
  setCaption(null);
  lastRank = null;
  update();
  syncDlBtn();
}
renderAll();
})();
</script>
